name: WolFox Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  THEOS: /opt/theos

jobs:
  linux-tests:
    name: Linux Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Run all Linux tests
        run: |
          set -eo pipefail

          c++ \
            -std=c++17 \
            -Wall \
            -Wextra \
            -D_USE_MATH_DEFINES \
            Tests/AllTests.cpp \
            Portable.cpp \
            -o tests

          ./tests 2>&1 | tee test_output.log

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: test_output.log
          if-no-files-found: error


  validate-config:
    name: Validate Config
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Validate target bundle IDs
        run: |
          set -e

          grep -v '#' WolFoxTargetBundles.txt \
            | grep -v '^[[:space:]]*$' \
            > /tmp/bundles.txt || true

          if [ ! -s /tmp/bundles.txt ]; then
            echo "FAIL: no target bundle IDs configured"
            exit 1
          fi

          if grep -q -F '*' WolFoxTargetBundles.txt; then
            echo "FAIL: wildcards forbidden"
            exit 1
          fi

          if ! grep -q 'Bundles' wolfox.plist; then
            echo "FAIL: wolfox.plist missing Bundles filter"
            exit 1
          fi

          echo "OK: targets validated:"
          cat /tmp/bundles.txt


  theos-build:
    name: Theos Build - Dylib Only
    needs:
      - linux-tests
      - validate-config

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4


      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bash \
            curl \
            sudo \
            git \
            build-essential \
            perl \
            rsync \
            wget \
            unzip \
            zip \
            xz-utils \
            python3 \
            clang \
            llvm \
            lld \
            file \
            fakeroot \
            dpkg-dev


      - name: Install Theos
        run: |
          set -e

          sudo mkdir -p /opt/theos
          sudo chown -R "$USER":"$USER" /opt/theos

          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

          echo "Theos installation completed."


      - name: Verify Theos installation
        run: |
          set -e

          echo "THEOS=$THEOS"

          echo "Checking Theos:"
          test -d "$THEOS"

          echo "Checking iOS toolchain:"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang"
          test -x "$THEOS/toolchain/linux/iphone/bin/clang++"

          echo "clang:"
          "$THEOS/toolchain/linux/iphone/bin/clang" --version

          echo "clang++:"
          "$THEOS/toolchain/linux/iphone/bin/clang++" --version

          echo "Installed SDKs:"
          ls -la "$THEOS/sdks"


      - name: Build WolFox dylib
        run: |
          set -e

          unset THEOS_PACKAGE_SCHEME

          echo "Cleaning old build..."
          make clean

          echo "Building WolFox.dylib..."
          make FINALPACKAGE=1 DEBUG=0


      - name: Locate generated WolFox.dylib
        run: |
          set -e

          echo "Searching for generated WolFox.dylib..."

          find . -type f -name "WolFox.dylib" -print

          DYLIB_PATH="$(find . -type f -name "WolFox.dylib" | head -n1)"

          if [ -z "$DYLIB_PATH" ]; then
            echo "FAIL: WolFox.dylib not found"
            exit 1
          fi

          echo "Found dylib:"
          echo "$DYLIB_PATH"

          mkdir -p artifacts

          cp -v \
            "$DYLIB_PATH" \
            artifacts/WolFox.dylib


      - name: Verify Mach-O dylib
        run: |
          set -e

          echo "File information:"
          file artifacts/WolFox.dylib

          FILE_INFO="$(file -b artifacts/WolFox.dylib)"

          echo "$FILE_INFO"

          echo "$FILE_INFO" \
            | grep -qi "dynamically linked shared library" \
            || {
              echo "FAIL: WolFox.dylib is not a dynamic library"
              exit 1
            }

          echo "$FILE_INFO" \
            | grep -qi "arm64" \
            || {
              echo "FAIL: WolFox.dylib does not contain arm64"
              exit 1
            }

          echo "WolFox.dylib verification passed."


      - name: Calculate SHA-256 checksum
        working-directory: artifacts
        run: |
          set -e

          sha256sum WolFox.dylib > SHA256SUMS.txt

          echo "SHA-256:"
          cat SHA256SUMS.txt


      - name: Upload WolFox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-dylib
          path: |
            artifacts/WolFox.dylib
            artifacts/SHA256SUMS.txt
          if-no-files-found: error