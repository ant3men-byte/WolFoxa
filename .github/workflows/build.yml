  theos-build:
    name: Theos Build - Dylib Only
    needs: [linux-tests, validate-config]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            perl \
            rsync \
            curl \
            wget \
            unzip \
            clang \
            llvm \
            lld \
            python3 \
            file \
            xz-utils

      - name: Install ldid
        run: |
          curl -L \
            https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64 \
            -o /usr/local/bin/ldid

          chmod +x /usr/local/bin/ldid

          echo "ldid installed successfully"

      - name: Prepare Theos + iPhoneOS SDK + Toolchain
        run: |
          set -e

          git clone --recursive https://github.com/theos/theos.git /opt/theos

          curl -L \
            https://github.com/theos/sdks/archive/refs/heads/master.zip \
            -o /tmp/sdks.zip

          unzip -q /tmp/sdks.zip -d /tmp/sdks

          mkdir -p /opt/theos/sdks

          cp -r /tmp/sdks/sdks-master/iPhoneOS* /opt/theos/sdks/

          echo "Available SDKs:"
          ls -la /opt/theos/sdks

          mkdir -p /opt/theos/toolchain

          curl -L \
            https://github.com/theos/toolchain/releases/latest/download/linux-x86_64.tar.xz \
            -o /tmp/theos-toolchain.tar.xz

          tar -xJf /tmp/theos-toolchain.tar.xz \
            -C /opt/theos/toolchain

          echo "Toolchain files:"
          find /opt/theos/toolchain -maxdepth 5 -type f | head -100

          test -x /opt/theos/toolchain/linux/iphone/bin/clang || {
            echo "FAIL: iOS clang not found"
            exit 1
          }

          test -x /opt/theos/toolchain/linux/iphone/bin/clang++ || {
            echo "FAIL: iOS clang++ not found"
            exit 1
          }

          /opt/theos/toolchain/linux/iphone/bin/clang --version

      - name: Build WolFox dylib
        run: |
          set -e

          unset THEOS_PACKAGE_SCHEME

          make clean
          make FINALPACKAGE=1 DEBUG=0

      - name: Locate generated WolFox.dylib
        run: |
          set -e

          echo "Searching for WolFox.dylib..."

          find . -type f -name "WolFox.dylib" -print

          DYLIB_PATH="$(find . -type f -name "WolFox.dylib" | head -n1)"

          if [ -z "$DYLIB_PATH" ]; then
            echo "FAIL: WolFox.dylib not found"
            exit 1
          fi

          mkdir -p artifacts

          cp -v "$DYLIB_PATH" artifacts/WolFox.dylib

      - name: Verify arm64 Mach-O dylib
        run: |
          set -e

          file artifacts/WolFox.dylib

          file -b artifacts/WolFox.dylib | grep -qi "dynamically linked shared library" || {
            echo "FAIL: WolFox.dylib is not a Mach-O dynamic library"
            exit 1
          }

          file -b artifacts/WolFox.dylib | grep -qi "arm64" || {
            echo "FAIL: WolFox.dylib has no arm64 slice"
            exit 1
          }

      - name: Calculate SHA-256 checksum
        working-directory: artifacts
        run: |
          sha256sum WolFox.dylib > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-dylib
          path: |
            artifacts/WolFox.dylib
            artifacts/SHA256SUMS.txt
          if-no-files-found: error