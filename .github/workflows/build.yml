name: WolFox Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  linux-tests:
    name: Linux Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Run all Linux tests
        run: |
          set -o pipefail
          c++ -std=c++17 -Wall -Wextra -D_USE_MATH_DEFINES Tests/AllTests.cpp Portable.cpp -o tests
          ./tests | tee test_output.log
      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: test_output.log
          if-no-files-found: error

  validate-config:
    name: Validate Config
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate target bundle IDs (no wildcards, not empty)
        run: |
          set -e
          grep -v '#' WolFoxTargetBundles.txt | grep -v '^[[:space:]]*$' > /tmp/bundles.txt || true
          test -s /tmp/bundles.txt || { echo "FAIL: no target bundle IDs configured"; exit 1; }
          if grep -q '\*' WolFoxTargetBundles.txt; then
            echo "FAIL: wildcards forbidden"
            exit 1
          fi
          grep -q 'Bundles' wolfox.plist || { echo "FAIL: wolfox.plist missing Bundles filter"; exit 1; }
          echo "OK: targets validated:"
          cat /tmp/bundles.txt

  theos-build:
    name: Theos Build (Rootful + Rootless)
    needs: [linux-tests, validate-config]
    runs-on: ubuntu-22.04
    env:
      THEOS: /opt/theos
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git perl rsync curl wget unzip clang llvm lld ldid python3 fakeroot dpkg-dev file xz-utils

      - name: Prepare Theos + iPhoneOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git /opt/theos
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/sdks
          find /tmp/sdks -maxdepth 1 -type d -name "iPhoneOS*" -exec cp -r {} /opt/theos/sdks/iPhoneOS.sdk \;
          test -d /opt/theos/sdks/iPhoneOS.sdk || { echo "NO IPHONEOS SDK FOUND"; exit 1; }
          echo "SDK installed"

      - name: Build Rootful package
        run: |
          export THEOS_PACKAGE_SCHEME=rootful
          make clean
          make package FINALPACKAGE=1 DEBUG=0
          mkdir -p artifacts
          find packages -name "*.deb" -exec cp {} artifacts/wolfox-rootful.deb \;

      - name: Build Rootless package
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make clean
          make package FINALPACKAGE=1 DEBUG=0
          find packages -name "*.deb" -exec cp {} artifacts/wolfox-rootless.deb \;

      - name: Locate generated dylib from actual build output
        run: |
          find . -type f -name "WolFox.dylib" -exec cp {} artifacts/WolFox.dylib \;
          test -f artifacts/WolFox.dylib || { echo "FAIL: WolFox.dylib not found"; exit 1; }

      - name: Verify arm64 Mach-O dynamic library
        run: |
          file -b artifacts/WolFox.dylib
          file -b artifacts/WolFox.dylib | grep -qi "dynamically linked shared library" || { echo "FAIL: not a dynamic library"; exit 1; }
          file -b artifacts/WolFox.dylib | grep -qi "arm64" || { echo "FAIL: no arm64 slice"; exit 1; }
          echo "OK: arm64 dylib verified"

      - name: Calculate SHA-256 checksums
        working-directory: artifacts
        run: |
          sha256sum WolFox.dylib wolfox-rootful.deb wolfox-rootless.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WolFox-build-artifacts
          path: |
            artifacts/WolFox.dylib
            artifacts/wolfox-rootful.deb
            artifacts/wolfox-rootless.deb
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
